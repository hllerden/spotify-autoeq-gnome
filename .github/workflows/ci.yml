name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: Install gjs and zip
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gjs zip
      - name: Run the logic tests and build the package
        run: make pack
      - uses: actions/upload-artifact@v7
        with:
          name: extension-zip
          path: dist/*.zip
